version: 2.1

jobs:
  deploy-production:
    docker:
      - image: cimg/node:24.8
    resource_class: small
    environment:
      CLOUDFLARE_ACCOUNT_ID: "85c112de7152c89bb5ea84fdcb397e41"
      PRODUCTION_URL: "https://pampasfields.com/"
    steps:
      - checkout
      - run:
          name: Build
          command: |
            set -euo pipefail
            npm ci
            npm run build
            test -d dist
            grep -RFn 'https://7thleaf.xyz' dist && exit 41 || true
            grep -RFq '7thleaf.thebase.in' dist
      - run:
          name: Deploy to Cloudflare Workers
          command: |
            set -euo pipefail
            : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
            : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
            npx --yes wrangler@4.141.0 deploy
      - run:
          name: Production readback
          command: |
            set -euo pipefail
            for i in $(seq 1 30); do
              curl -fsS --max-time 15 "$PRODUCTION_URL" -o /tmp/pampas-live.html || true
              asset="$(grep -oE 'src="/assets/site-[^"]+\.js"' /tmp/pampas-live.html | head -1 | cut -d'"' -f2 || true)"
              if grep -Fq 'Independent creative project based in Sapporo, Japan.' /tmp/pampas-live.html &&
                 grep -Fq 'BROWSER TOOLS' /tmp/pampas-live.html &&
                 ! grep -Fq 'stashthemes.com' /tmp/pampas-live.html &&
                 [ -n "$asset" ]; then
                curl -fsS --max-time 15 "https://pampasfields.com$asset" -o /tmp/pampas-live.js || true
                if ! grep -Fq '7thleaf.xyz' /tmp/pampas-live.js &&
                   grep -Fq '7thleaf.thebase.in' /tmp/pampas-live.js; then
                  echo "PAMPASFIELDS_PRODUCTION_READBACK=PASS"
                  exit 0
                fi
              fi
              sleep 4
            done
            exit 33

workflows:
  production:
    jobs:
      - deploy-production:
          context: 7thleaf-studios-deploy
          serial-group: << pipeline.project.slug >>/production
          filters:
            branches:
              only: main
